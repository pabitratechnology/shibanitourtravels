# Nginx Virtual Host for Shibani Tour & Travels
# Domain: shibanitourtravels.com & www.shibanitourtravels.com
# Port: Proxies to internal Node.js backend running on 127.0.0.1:5050 (or your chosen free port)

server {
    listen 80;
    listen [::]:80;
    server_name shibanitourtravels.com www.shibanitourtravels.com;

    # Client body limit for vehicle/blog image uploads (up to 20MB)
    client_max_body_size 20M;

    # Proxy to Node/Express backend which serves both API and built React SPA frontend
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Direct static serving for uploads if desired
    location /uploads/ {
        alias /var/www/shibanitourtravels/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
